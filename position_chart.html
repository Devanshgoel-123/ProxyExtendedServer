
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Position Analysis - Daily at 8 AM UTC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
        }
        .chart-container {
            position: relative;
            height: 500px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }
        .footer {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9em;
        }
        @media print {
            body {
                background: white;
            }
            .container {
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 BTC Position Analysis</h1>
        <div class="subtitle">Daily Positions at 8:00 AM UTC | 2025-12-26 to 2026-02-02</div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Days</div>
                <div class="stat-value">39</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Average Position</div>
                <div class="stat-value">0.00679</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Max Position</div>
                <div class="stat-value">0.00766</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Min Position</div>
                <div class="stat-value">0.00544</div>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="positionChart"></canvas>
        </div>
        
        <div class="footer">
            Generated on 2/2/2026, 5:25:41 PM | Data from Trade History
        </div>
    </div>
    
    <script>
        const ctx = document.getElementById('positionChart').getContext('2d');
        
        const data = {
            labels: ["2025-12-26","2025-12-27","2025-12-28","2025-12-29","2025-12-30","2025-12-31","2026-01-01","2026-01-02","2026-01-03","2026-01-04","2026-01-05","2026-01-06","2026-01-07","2026-01-08","2026-01-09","2026-01-10","2026-01-11","2026-01-12","2026-01-13","2026-01-14","2026-01-15","2026-01-16","2026-01-17","2026-01-18","2026-01-19","2026-01-20","2026-01-21","2026-01-22","2026-01-23","2026-01-24","2026-01-25","2026-01-26","2026-01-27","2026-01-28","2026-01-29","2026-01-30","2026-01-31","2026-02-01","2026-02-02"],
            datasets: [{
                label: 'BTC Position at 8 AM UTC',
                data: [0.0069,0.00703,0.00674,0.006860000000000001,0.006490000000000001,0.006930000000000001,0.006930000000000001,0.006980000000000001,0.006980000000000001,0.006980000000000001,0.006920000000000001,0.006920000000000001,0.00643,0.0070799999999999995,0.0069299999999999995,0.0066999999999999985,0.0066999999999999985,0.007069999999999999,0.007069999999999999,0.006799999999999999,0.006269999999999999,0.006669999999999999,0.006669999999999999,0.006669999999999999,0.006389999999999999,0.005439999999999999,0.006659999999999997,0.006419999999999997,0.006479999999999998,0.006519999999999997,0.006519999999999997,0.006069999999999998,0.006849999999999998,0.0068499999999999985,0.007659999999999999,0.007239999999999999,0.007519999999999999,0.007469999999999998,0.007089999999999999],
                borderColor: 'rgb(102, 126, 234)',
                backgroundColor: 'rgba(102, 126, 234, 0.1)',
                borderWidth: 2,
                pointRadius: 4,
                pointHoverRadius: 6,
                pointBackgroundColor: 'rgb(102, 126, 234)',
                pointBorderColor: '#fff',
                pointBorderWidth: 2,
                tension: 0.4,
                fill: true
            }]
        };
        
        const config = {
            type: 'line',
            data: data,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'BTC Position Over Time',
                        font: {
                            size: 18,
                            weight: 'bold'
                        },
                        padding: 20
                    },
                    legend: {
                        display: true,
                        position: 'top',
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false,
                        callbacks: {
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                label += context.parsed.y.toFixed(8) + ' BTC';
                                return label;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        display: true,
                        title: {
                            display: true,
                            text: 'Date',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        ticks: {
                            maxRotation: 45,
                            minRotation: 45,
                            autoSkip: true,
                            maxTicksLimit: 20
                        }
                    },
                    y: {
                        display: true,
                        title: {
                            display: true,
                            text: 'Position (BTC)',
                            font: {
                                size: 14,
                                weight: 'bold'
                            }
                        },
                        ticks: {
                            callback: function(value) {
                                return value.toFixed(5);
                            }
                        }
                    }
                },
                interaction: {
                    mode: 'nearest',
                    axis: 'x',
                    intersect: false
                }
            }
        };
        
        new Chart(ctx, config);
    </script>
</body>
</html>
